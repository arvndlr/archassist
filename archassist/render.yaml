# Render Blueprint: one free web service that serves both the API and the React app.
# Database: use a free Neon Postgres (pgvector supported) and paste its URL as DATABASE_URL.
services:
  - type: web
    name: archassist
    runtime: node
    plan: free
    buildCommand: npm run build:prod
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@archassist.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: LLM_MAX_TOKENS
        value: "8000"
      - key: EMBEDDING_PROVIDER
        value: local
