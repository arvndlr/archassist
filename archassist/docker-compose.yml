# Local PostgreSQL with pgvector for Archassist.
#   docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archassist
    ports:
      - "5432:5432"
    volumes:
      - archassist_pg:/var/lib/postgresql/data
volumes:
  archassist_pg:
